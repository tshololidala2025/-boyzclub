<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner With Us — We Are Boys</title><link rel="stylesheet" href="../style.css"></head><body><main class="form-page"><a class="toplink" href="../">← Back to We Are Boys</a><section class="card"><p class="eyebrow">WE ARE BOYS PARTNERSHIPS</p><h1>Help build what comes next.</h1><p class="lead">We Are Boys welcomes organisations, professionals and community partners who can help create meaningful exposure, resources, experiences and opportunities for boys aged 8–18.</p><form id="partnerForm"><div class="two"><label>Contact person<input name="contact_name" autocomplete="name" required></label><label>Organisation / company<input name="organisation" autocomplete="organization"></label></div><div class="two"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Phone number<input name="phone" type="tel" autocomplete="tel"></label></div><label>How would you like to partner with We Are Boys?<select name="partnership_type"><option value="">Select an option</option><option>Career exposure / workplace visits</option><option>Workshops or skills development</option><option>Mentorship support</option><option>Education or training opportunities</option><option>Sports or wellbeing activities</option><option>Sponsorship or resources</option><option>Community collaboration</option><option>Other</option></select></label><label>Tell us more about the partnership you have in mind<textarea name="details" placeholder="Share what your organisation could offer, the type of opportunity, and any ideas you would like us to explore."></textarea></label><button class="btn primary" type="submit" data-label="Send partnership enquiry">Send partnership enquiry</button><p class="status" hidden aria-live="polite"></p></form></section></main><script src="../form.js"></script><script>document.getElementById('partnerForm').addEventListener('submit', e => submitForm(e, 'partner_enquiries', {contact_name:'contact_name',organisation:'organisation',email:'email',phone:'phone',partnership_type:'partnership_type',details:'details'}));</script></body></html>
