<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a Mentor — We Are Boys</title><link rel="stylesheet" href="../style.css"></head><body><main class="form-page"><a class="toplink" href="../">← Back to We Are Boys</a><section class="card"><p class="eyebrow">WE ARE BOYS</p><h1>You were a boy once. Reach back.</h1><p class="lead">We Are Boys mentors are positive adult men who can offer boys guidance, encouragement, perspective and a responsible example of manhood. Applications are reviewed and screened before any matching takes place.</p><form id="mentorForm"><div class="two"><label>Full name<input name="full_name" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label></div><div class="two"><label>Phone number<input name="phone" type="tel" autocomplete="tel" required></label><label>Area / city<input name="area" placeholder="e.g. Johannesburg"></label></div><div class="two"><label>Occupation / profession<input name="occupation" placeholder="e.g. Engineer, Teacher, Entrepreneur"></label><label>Years of experience<select name="experience_range"><option value="">Select</option><option>0–2 years</option><option>3–5 years</option><option>6–10 years</option><option>11–20 years</option><option>20+ years</option></select></label></div><label>Why would you like to mentor through We Are Boys?<textarea name="motivation" required placeholder="Tell us what motivates you to support boys and young men."></textarea></label><label>Areas where you can offer support<textarea name="support_areas" placeholder="For example: school, careers, entrepreneurship, sport, confidence, leadership, technology or life skills."></textarea></label><label>Previous experience working with or supporting young people<textarea name="youth_experience" placeholder="This can include parenting, coaching, teaching, community work, volunteering or mentoring."></textarea></label><label class="check"><input name="consent_screening" type="checkbox" required><span>I understand that mentor participation is subject to We Are Boys safeguarding and suitability screening.</span></label><label class="check"><input name="consent_terms" type="checkbox" required><span>I agree to follow We Are Boys mentor boundaries, safeguarding expectations and programme rules if approved.</span></label><button class="btn primary" type="submit" data-label="Submit mentor application">Submit mentor application</button><p class="status" hidden aria-live="polite"></p></form></section></main><script src="../form.js"></script><script>document.getElementById('mentorForm').addEventListener('submit', e => submitForm(e, 'mentor_applications', {full_name:'full_name',email:'email',phone:'phone',area:'area',occupation:'occupation',experience_range:'experience_range',motivation:'motivation',support_areas:'support_areas',youth_experience:'youth_experience',consent_screening:'consent_screening',consent_terms:'consent_terms'}));</script></body></html>
